version: "3.9"

services:

  # IB Gateway (headless, auto-login)
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    environment:
      - TWS_USERID=${IB_USERNAME}
      - TWS_PASSWORD=${IB_PASSWORD}
      - TRADING_MODE=paper
      - TWS_SETTINGS_PATH=/home/ibgateway/Jts
      - TWOFA_TIMEOUT_ACTION=exit
    ports:
      - "4002:4002"   # paper API port
      - "5900:5900"   # VNC (optional, for debugging)
    volumes:
      - ib-gateway-data:/home/ibgateway/Jts

  # LSM-v2 paper trader
  paper:
    build: .
    restart: unless-stopped
    depends_on:
      - ib-gateway
    environment:
      - IB_ACCOUNT=${IB_ACCOUNT}
    volumes:
      - ./logs:/app/logs
      - ./configs:/app/configs
    command:
      - "python"
      - "scripts/run_paper.py"
      - "--config"
      - "configs/config.yaml"

  # Backtest (run manually: docker compose run backtest)
  backtest:
    build: .
    profiles: ["backtest"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    command:
      - "python"
      - "scripts/run_backtest.py"
      - "--csv"
      - "data/historical/MNQ_5m_2024.csv"
      - "--config"
      - "configs/config.yaml"
      - "--start"
      - "2024-01-01"
      - "--end"
      - "2024-12-31"

volumes:
  ib-gateway-data:
