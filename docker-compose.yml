version: "3.9"

services:
  paper:
    build: .
    restart: unless-stopped
    environment:
      - TV_USERNAME=${TV_USERNAME}
      - TV_PASSWORD=${TV_PASSWORD}
      - TV_CID=${TV_CID}
      - TV_SECRET=${TV_SECRET}
      - TV_DEMO=${TV_DEMO:-true}
    volumes:
      - ./logs:/app/logs
      - ./configs:/app/configs
    command:
      - "python"
      - "scripts/run_paper.py"
      - "--config"
      - "configs/config.yaml"

  backtest:
    build: .
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    command:
      - "python"
      - "scripts/run_backtest.py"
      - "--csv"
      - "data/historical/MNQ_1m_2024.csv"
      - "--config"
      - "configs/config.yaml"
      - "--start"
      - "2024-01-01"
      - "--end"
      - "2024-12-31"
